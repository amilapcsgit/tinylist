<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeonList</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --text: #172033;
      --muted: #5f6b7a;
      --line: #dce3ee;
      --accent: #008d9b;
      --accent-bg: #e9fbfd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 72px 0;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 16px 40px rgba(23, 32, 51, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.25rem, 8vw, 4rem);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1.125rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      border-radius: 10px;
      background: var(--accent-bg);
      color: var(--accent);
      padding: 0 16px;
      font-weight: 700;
      text-decoration: none;
    }

    a:focus,
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">NeonList</h1>
      <p>Offline-first list management for Android.</p>
      <a href="./privacy-policy/">Privacy Policy</a>
    </section>
  </main>
</body>
</html>
